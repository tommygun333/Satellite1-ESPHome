# Runtime controls for Micro Wake Word thresholds
# NOTE: Do NOT include external_components here. The top-level config already points to local components.

number:
  - platform: template
    id: wake_prob_cutoff
    name: "Wake word probability cutoff"
    icon: "mdi:account-voice"
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    optimistic: true
    restore_value: true
    initial_value: 0.75
    on_value:
      then:
        - lambda: |-
            id(mww).set_wake_word_probability_cutoff(x);

  - platform: template
    id: wake_window
    name: "Wake word sliding window"
    icon: "mdi:chart-timeline-variant-shimmer"
    min_value: 1
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 10
    on_value:
      then:
        - lambda: |-
            id(mww).set_wake_word_sliding_window_size((size_t) x);

  - platform: template
    id: vad_prob_cutoff
    name: "VAD probability cutoff"
    icon: "mdi:waveform"
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    optimistic: true
    restore_value: true
    initial_value: 0.70
    on_value:
      then:
        - lambda: |-
            id(mww).set_vad_probability_cutoff(x);

  - platform: template
    id: vad_window
    name: "VAD sliding window"
    icon: "mdi:timeline-clock"
    min_value: 1
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 20
    on_value:
      then:
        - lambda: |-
            id(mww).set_vad_sliding_window_size((size_t) x);

esphome:
  on_boot:
    then:
      - lambda: |-
          id(mww).set_wake_word_probability_cutoff(id(wake_prob_cutoff).state);
          id(mww).set_wake_word_sliding_window_size((size_t) id(wake_window).state);
          id(mww).set_vad_probability_cutoff(id(vad_prob_cutoff).state);
          id(mww).set_vad_sliding_window_size((size_t) id(vad_window).state);